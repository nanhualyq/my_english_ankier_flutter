<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 深蓝色渐变背景 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2240;stop-opacity:1" />
    </linearGradient>
    <!-- 星星渐变 -->
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c842;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8a820;stop-opacity:1" />
    </linearGradient>
    <!-- 星星外发光 -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 文字阴影 -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" ry="200" fill="url(#bgGradient)"/>

  <!-- 装饰：底部的浅色弧线，增加层次感 -->
  <ellipse cx="512" cy="900" rx="600" ry="200" fill="#1e4470" opacity="0.5"/>

  <!-- 五角星 - 居中偏上 -->
  <g transform="translate(512, 380) scale(1)" filter="url(#starGlow)">
    <polygon
      points="0,-220 62,-70 216,-70 90,30 135,190 0,100 -135,190 -90,30 -216,-70 -62,-70"
      fill="url(#starGradient)"
      stroke="#d4961a"
      stroke-width="3"
    />
    <!-- 星星内侧高光 -->
    <polygon
      points="0,-160 45,-50 155,-50 65,22 97,138 0,72 -97,138 -65,22 -155,-50 -45,-50"
      fill="none"
      stroke="#ffe580"
      stroke-width="2"
      opacity="0.6"
    />
  </g>

  <!-- "Aa" 文字 - 居中偏下 -->
  <g filter="url(#textShadow)">
    <!-- 大写 A -->
    <text x="360" y="720" font-family="Georgia, 'Times New Roman', serif" font-size="260" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="-8">A</text>
    <!-- 小写 a -->
    <text x="640" y="720" font-family="Georgia, 'Times New Roman', serif" font-size="200" font-weight="normal" fill="white" opacity="0.85" text-anchor="middle">a</text>
  </g>

  <!-- 装饰：小点缀粒子 -->
  <circle cx="200" cy="200" r="6" fill="white" opacity="0.3"/>
  <circle cx="830" cy="180" r="4" fill="white" opacity="0.25"/>
  <circle cx="150" cy="500" r="5" fill="white" opacity="0.2"/>
  <circle cx="870" cy="450" r="7" fill="white" opacity="0.15"/>
  <circle cx="300" cy="150" r="3" fill="white" opacity="0.2"/>
  <circle cx="750" cy="130" r="5" fill="white" opacity="0.25"/>
</svg>
